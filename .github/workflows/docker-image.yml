name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: latest
            ffmpeg: "false"
          - name: latest-ffmpeg
            ffmpeg: "true"

    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build the Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        build-args: |
          INSTALL_FFMPEG=${{ matrix.ffmpeg }}
        push: true
        tags: |
          travisvn/openai-edge-tts:${{ matrix.name }}
        cache-from: type=registry,ref=travisvn/openai-edge-tts:${{ matrix.name }}-cache
        cache-to: type=registry,ref=travisvn/openai-edge-tts:${{ matrix.name }}-cache,mode=max